<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistente de Cierre Infinitum</title>
<style>
:root{--b:#087bc1;--bd:#075985;--r:#e6243c;--g:#14835d;--y:#f2ad22;--ink:#172033;--mut:#667085;--line:#dce4eb;--bg:#f2f5f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}.app{max-width:650px;margin:auto;min-height:100vh;background:#fff}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 15px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:19px;font-weight:900;color:var(--b)}.stage{font-size:12px;background:#eaf6fd;color:var(--bd);padding:5px 9px;border-radius:99px;font-weight:750}.prog{height:5px;background:#edf1f4;margin-top:10px;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--b);width:10%;transition:.2s}
main{padding:18px 15px 110px}.k{font-size:12px;color:var(--b);font-weight:850;text-transform:uppercase;letter-spacing:.08em}h1{font-size:25px;line-height:1.14;margin:6px 0 7px}.sub{color:var(--mut);margin:0 0 17px}.choices{display:grid;gap:9px}.choice{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:left;color:var(--ink);cursor:pointer}.choice strong{display:block;font-size:16px}.choice span{display:block;color:var(--mut);font-size:13px;margin-top:3px}.choice.primary{border-color:#9dd4f2;background:#f6fcff}.msg{margin-top:16px;border-left:4px solid var(--b);background:#f4faff;padding:13px;border-radius:9px}.msg label{display:block;font-size:11px;font-weight:850;color:var(--b);margin-bottom:5px}.msg p{margin:0;white-space:pre-line}.copy{border:0;background:#fff;color:var(--b);font-weight:800;border-radius:8px;padding:8px 10px;margin-top:10px}
.coach{margin-top:10px;padding:13px;border-radius:9px}.coach.impulse{background:#fff8e8;border-left:4px solid #f2ad22}.coach.close{background:#eef9f4;border-left:4px solid #14835d}
.coach label{display:block;font-size:11px;font-weight:850;margin-bottom:5px}.coach.impulse label{color:#9a6500}.coach.close label{color:#11704f}.coach p{margin:0;white-space:pre-line}.coach .copy{margin-top:9px}
.coach small{display:block;margin-top:7px;color:var(--mut)}
.coach summary{cursor:pointer;font-size:12px;font-weight:900;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.coach summary::-webkit-details-marker{display:none}.coach summary span{font-size:11px;font-weight:800;color:var(--mut);background:#fff;padding:5px 8px;border-radius:99px}
.coach[open] summary span{font-size:0}.coach[open] summary span:after{content:"Ocultar ejemplos";font-size:11px}
.coachBody{margin-top:8px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.row span{color:var(--mut)}.good,.warn{padding:12px;border-radius:9px;margin:12px 0}.good{background:#edf9f4;border-left:4px solid var(--g)}.warn{background:#fff7df;border-left:4px solid var(--y)}.red{color:var(--r);font-weight:850}.check{display:grid;gap:8px}.check div{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.check b{color:var(--g)}
details{border:1px solid var(--line);border-radius:11px;padding:11px;margin:9px 0}summary{font-weight:800;cursor:pointer}.pkgs{display:grid;gap:7px;margin-top:10px}.pkg{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f4;padding:8px 2px}.pkg b{color:var(--b)}
.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1;border:1px solid var(--line);background:#fff;padding:9px;border-radius:9px;font-weight:750}.tabs .on{background:var(--b);color:#fff;border-color:var(--b)}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(650px,100%);display:flex;gap:8px;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 15px calc(11px + env(safe-area-inset-bottom))}footer button{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}footer .new{color:var(--r)}
@media(min-width:600px){main{padding-left:24px;padding-right:24px}}
</style></head>
<body><div class="app"><header><div class="top"><div class="logo">infinitum · Asistente de Cierre</div><div class="stage" id="stage">Inicio</div></div><div class="prog"><i id="prog"></i></div></header><main id="main"></main>
<footer><button id="back" onclick="back()">← Regresar</button><button onclick="faq()">❓ FAQ / Dudas</button><button class="new" onclick="reset()">Nueva venta</button></footer></div>
<script>
const I=[["200 megas",349],["400 megas",449],["600 megas",549],["1000 megas",899]], L=[["200 megas",389],["300 megas",435],["400 megas",499],["500 megas",599],["600 megas",649],["1000 megas",999]];
let hist=[], data={}, current;
const M=()=>document.getElementById("main");
function draw(stage,title,sub,body,msg="",impulse="",closing=""){document.getElementById("stage").textContent=stage;document.getElementById("prog").style.width=Math.min(95,12+hist.length*11)+"%";M().innerHTML=`<div class=k>${stage}</div><h1>${title}</h1><p class=sub>${sub}</p>${body}${msg?message(msg):""}${impulse?coach("FACTOR DE IMPULSO",impulse,"impulse"):""}${closing?coach("TIPO DE CIERRE SUGERIDO",closing,"close"):""}`;document.getElementById("back").disabled=!hist.length}
function message(t){return `<div class=msg><label>MENSAJE SUGERIDO PARA WHATSAPP</label><p>${t}</p><button class=copy onclick="cp(this)">Copiar mensaje</button></div>`}
function coach(label,t,kind){let a=String(t).split("|||");return `<details class="coach ${kind}"><summary>${label} <span>Ver ejemplos</span></summary><div class="coachBody">${a.map((x,i)=>`<div style="padding:9px 0;border-top:${i?"1px solid rgba(0,0,0,.08)":"0"}"><small>Ejemplo ${i+1}</small><p>${x}</p><button class=copy onclick="cp(this)">Copiar ejemplo</button></div>`).join("")}</div></details>`}
function cp(b){navigator.clipboard?.writeText(b.previousElementSibling.innerText);b.textContent="Copiado ✓";setTimeout(()=>b.textContent="Copiar mensaje",1000)}
function opts(a){return `<div class=choices>${a.map(x=>`<button class="choice ${x[3]||""}" onclick="${x[2]}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join("")}</div>`}
function nav(f){hist.push(current);current=f;f()} function back(){if(hist.length){current=hist.pop();current()}} function reset(){hist=[];data={};current=start;start()}
function start(){draw("Paso 1","Clasifica al prospecto","La primera meta es saber qué ruta corresponde. No expliques todo todavía.",opts([
["Servicio nuevo","Primera contratación en ese domicilio.","data.tipo='Nuevo';nav(modalidad)","primary"],
["Cambio de compañía","Tiene Izzi, Totalplay, Megacable u otra.","nav(compania)"]
]),"¡Hola! Claro que sí 😊 ¿Busca contratar internet por primera vez en ese domicilio o quiere cambiarse de otra compañía?")}
function modalidad(){draw("Paso 2","¿Solo Internet o también línea?","Presenta el paquete base después de saber la modalidad.",opts([
["Solo Internet","Paquete base: 200 megas por $349.","data.modal='Solo Internet';data.precio=349;nav(oferta)","primary"],
["Internet + línea","Paquete base: 200 megas por $389.","data.modal='Internet + línea';data.precio=389;nav(oferta)"]
]),"Perfecto. ¿Busca solo Internet o Internet + línea telefónica?")}
function compania(){draw("Paso 2","¿Con qué compañía cuenta?","Megacable abre la ruta de alta/recuperación además de portabilidad.",opts([
["Megacable","Preguntar si tiene línea telefónica activa.","data.comp='Megacable';nav(megaLinea)","primary"],
["Izzi / Totalplay","Preguntar por línea activa para portabilidad.","data.comp='Izzi/Totalplay';nav(otraLinea)"],
["Otra","Revisar como servicio nuevo según procedimiento.","data.tipo='Nuevo';nav(modalidad)"]
]),"Perfecto 😊 ¿Con qué compañía cuenta actualmente?")}
function megaLinea(){draw("Paso 3","¿Tiene línea telefónica activa?","Si tiene línea, puede evaluarse portabilidad. Si no, alta/recuperación.",opts([
["Sí tiene línea","Ruta de portabilidad.","data.tipo='Portabilidad';data.modal='Internet + línea';data.precio=389;nav(ofertaPorta)","primary"],
["No tiene línea","Ruta de alta/recuperación Megacable.","data.tipo='Alta';data.modal='Solo Internet';data.precio=349;nav(ofertaAlta)"]
]),"¿Su servicio de Megacable cuenta con línea telefónica de casa?")}
function otraLinea(){draw("Paso 3","¿Tiene línea telefónica activa?","La portabilidad requiere número telefónico.",opts([
["Sí","Portabilidad.","data.tipo='Portabilidad';data.modal='Internet + línea';data.precio=389;nav(ofertaPorta)","primary"],
["No","Continuar como servicio nuevo.","data.tipo='Nuevo';nav(modalidad)"]
]),"¿Cuenta con una línea telefónica activa con su compañía actual?")}
function oferta(){let t=data.modal==="Solo Internet"?"200 megas simétricos por $349 al mes":"200 megas por $389 al mes con línea telefónica";draw("Paso 3","Presenta UNA oferta y verifica cobertura","No satures con todos los paquetes. El objetivo es avanzar a cobertura.",opts([["Ya tengo CP / colonia / ubicación","Verificar cobertura.","nav(cobertura)","primary"],["Quiere otra velocidad","Ver tabla de paquetes.","nav(paquetes)"]]),`Le recomiendo nuestro paquete de ${t}. ¿Me comparte su código postal, colonia o ubicación para corroborar cobertura?`,
"Urgencia · “Si me comparte su ubicación ahora mismo, yo reviso la cobertura y le digo enseguida si podemos avanzar.”|||Facilidad · “Mándeme su ubicación y yo hago la revisión; usted no tiene que buscar nada más.”|||Beneficio · “Primero revisamos cobertura y así le digo exactamente qué paquete puede aprovechar.”",
"Doble alternativa · “¿Le reviso primero el paquete básico o prefiere una opción con más velocidad?”|||Doble alternativa · “¿Busca ahorrar con el paquete básico o prefiere priorizar más velocidad?”|||Conclusión · “Entonces revisamos cobertura y, si está disponible, avanzamos con el paquete que elija.”")}
function ofertaPorta(){draw("Paso 4","Portabilidad: vende el beneficio clave","Después confirma cobertura. No pidas documentos todavía.",opts([["Verificar cobertura","Tengo domicilio/ubicación.","nav(cobertura)","primary"],["Pregunta por paquetes","Mostrar opciones.","nav(paquetes)"]]),"Por portabilidad podemos manejarle Internet + línea desde $389 al mes. Además, los meses 4, 8 y 12 son sin costo. Antes de continuar, permítame verificar cobertura en su domicilio. ¿Me comparte su código postal, colonia o ubicación?",
"Beneficio · “Además de conservar su número, tendría los meses 4, 8 y 12 sin costo.”|||Ahorro · “La portabilidad incluye meses sin costo; revisemos si su domicilio entra en cobertura.”|||Facilidad · “Si me comparte su ubicación, yo reviso cobertura y le explico cómo quedaría el cambio.”",
"Amarre · “Le conviene aprovechar los meses sin costo, ¿verdad? Revisemos cobertura.”|||Amarre · “Me comenta que su compañía ya le subió la tarifa, ¿verdad? Comparemos cuánto pagaría aquí.”|||Rebote · “Si lo que le preocupa es pagar más al cambiarse, ¿le parece si calculamos el costo del primer año?”")}
function ofertaAlta(){draw("Paso 4","Alta / recuperación Megacable","El requisito adicional es el estado de cuenta de Megacable. Primero confirma cobertura.",opts([["Verificar cobertura","Tengo domicilio/ubicación.","nav(cobertura)","primary"],["Quiere otra velocidad","Mostrar paquetes.","nav(paquetes)"]]),"Podemos manejarle el alta con paquete de solo Internet desde $349 al mes. Primero permítame verificar cobertura en su domicilio. ¿Me comparte su código postal, colonia o ubicación?",
"Facilidad · “Si me comparte su ubicación, yo mismo reviso la cobertura y le voy guiando.”|||Urgencia · “La revisión me toma un momento; si me manda su ubicación resolvemos esa parte ahora.”|||Beneficio · “Primero confirmamos cobertura y así sabemos si puede aprovechar el alta.”",
"Conclusión · “Entonces revisamos cobertura y, si está disponible, avanzamos con su alta.”|||Doble alternativa · “¿Me manda su ubicación o prefiere código postal y colonia?”|||Amarre · “Lo importante es confirmar primero que sí podamos instalarle, ¿verdad?”")}
function paquetes(){let a=data.modal==="Internet + línea"?L:I;draw("Paquetes","Elige sin perder el rumbo","Después de responder, vuelve inmediatamente a cobertura.",`<div class=pkgs>${a.map(x=>`<div class=pkg><b>${x[0]}</b><span>$${x[1]}/mes</span></div>`).join("")}</div>${opts([["Continuar a cobertura","Ya eligió / ya resolví la duda.","nav(cobertura)","primary"]])}`,"De acuerdo. Tenemos estas opciones. ¿Cuál le interesa más? En cuanto me confirme, revisamos cobertura para continuar con su solicitud.")}
function cobertura(){draw("Paso clave","¿Hay cobertura?","Este punto decide si se puede avanzar al cierre.",opts([
["Sí hay cobertura","Deja de vender y pide acuerdo para proceder.","nav(preCierre)","primary"],
["Mapa no confirma cobertura","Revisar si aparece red INFINITUM cercana.","nav(redWifi)"]
]),"Le confirmo que sí contamos con cobertura de fibra óptica 😁 ¿Le parece bien que continuemos con la solicitud?",
"Exclusividad · “Excelente, su domicilio sí entra en cobertura. Ya podemos trabajar la opción que revisamos.”|||Facilidad · “Ya resolvimos lo más importante: sí hay cobertura. Ahora solo falta generar su solicitud.”|||Beneficio · “Con cobertura confirmada podemos dejarle el paquete elegido y avanzar.”",
"Doble alternativa · “¿Avanzamos con el paquete que vimos o comparamos la siguiente velocidad?”|||Doble alternativa · “¿Prefiere solo Internet o Internet + línea?”|||Conclusión · “Perfecto, ya hay cobertura; entonces pasamos a sus datos.”")}
function redWifi(){draw("Cobertura","Haz una comprobación adicional","Una red cercana es un indicio; sigue el procedimiento interno antes de confirmar instalación.",opts([
["Aparece red INFINITUM","Continuar con revisión interna.","nav(revisionCob)","primary"],
["No aparece","No prometer instalación.","nav(noCob)"]
]),"El mapa no me confirma cobertura. ¿Me apoya revisando en su celular si entre las redes Wi‑Fi disponibles aparece alguna que diga INFINITUM?")}
function revisionCob(){draw("Revisión","Verifica antes de cerrar","No confirmes cobertura únicamente por ver una red cercana.",opts([["Cobertura confirmada","Ir al cierre.","nav(preCierre)","primary"],["No se pudo confirmar","Cerrar seguimiento.","nav(noCob)"]]),"Gracias. Veo un indicio de red cercana; permítame verificar la posibilidad de instalación antes de confirmarle el servicio.")}
function noCob(){draw("Sin cobertura","No des vueltas","Registra el caso según el proceso interno.",`<div class=warn><b>No avances a documentos ni pago</b> hasta tener cobertura confirmada.</div>`,"Por el momento no me es posible confirmar cobertura en su domicilio. Prefiero verificarlo correctamente antes de hacerle iniciar una solicitud.")}
function preCierre(){
 let extra=data.tipo==="Portabilidad"?"<div class=row><span>Beneficio</span><b>Meses 4, 8 y 12 gratis</b></div>":data.tipo==="Alta"?"<div class=row><span>Requisito extra</span><b>Estado de cuenta Megacable</b></div>":"<div class=row><span>Instalación</span><b>$1,600 total</b></div>";
 let pago=data.tipo==="Nuevo"?"$400 forman parte de instalación":"$400 se abonan a recibos";
 draw("Cierre","YA NO SIGAS VENDIENDO","Si el cliente acepta paquete y hay cobertura, la siguiente acción es pedir datos.",`<div class=card><div class=row><span>Ruta</span><b>${data.tipo}</b></div><div class=row><span>Modalidad</span><b>${data.modal||"Según paquete"}</b></div><div class=row><span>Pago inicial</span><b>$400</b></div><div class=row><span>Aplicación</span><b>${pago}</b></div>${extra}</div>${opts([["Cliente acepta → pedir datos","Abrir checklist exacto.","nav(documentos)","primary"],["Tiene duda sobre $400","Explicarla y volver al cierre.","nav(duda400)"],["Pregunta por HBO / Netflix","Responder y volver al cierre.","nav(streaming)"],["Está comparando con otra compañía","Usar cierre Benjamín Franklin.","nav(benjamin)"]])}`,
 data.tipo==="Nuevo"?
 "Excelente, sí contamos con cobertura. Para continuar, se realiza un pago inicial de $400, que forma parte de los gastos de instalación. Si está de acuerdo, procedemos con sus datos para generar la solicitud.":
 "Excelente, sí contamos con cobertura. Para continuar, se realiza un pago inicial de $400 que se abona a su servicio. Si está de acuerdo, procedemos con sus datos para generar la solicitud.",
 data.tipo==="Portabilidad"?
 "Codicia / beneficio · Recuérdale lo que obtiene con esta ruta:\n“Además de que los $400 quedan abonados al servicio, conserva su número y mantiene el beneficio de los meses 4, 8 y 12 sin costo.”":
 "Urgencia · Haz fácil el siguiente paso:\n“Ya tenemos cobertura; si me comparte sus datos, yo preparo la solicitud y le voy indicando cada paso.”",
 data.tipo==="Portabilidad"?
 "Benjamín Franklin · COMPARA EL COSTO REAL: “No comparemos solo la mensualidad de entrada. Veamos cuánto pagaría realmente en 12 meses y cuánto queda pagando después de que terminan las promociones. Ahí es donde se ve cuál opción le conviene.”|||Benjamín Franklin · COSTO DEL PRIMER AÑO: “Si me dice cuánto paga actualmente y qué velocidad tiene, hacemos la cuenta anual. Comparamos mensualidades, instalación, promociones y el precio que queda después.”|||Benjamín Franklin · PRECIO PROMOCIONAL VS. REAL: “La pregunta no es solamente quién anuncia el precio más bajo hoy, sino cuánto termina pagando cuando acaba la promoción. ¿Comparamos el costo real de las dos opciones?”":
 "Conclusión · “Perfecto, entonces continuamos con sus datos para dejar preparada la solicitud.”|||Doble alternativa · “¿Me comparte primero su INE o los datos del domicilio?”|||Amarre · “Ya confirmamos cobertura y el paquete le funciona, ¿correcto? Entonces avanzamos.”"
 );addCloseCoach()}
function addCloseCoach(){
 if(document.querySelector(".coach")) return;
 const main=M();
 const imp=data.tipo==="Nuevo"
 ?"Urgencia · Hazle sentir que el trámite es sencillo:\n“Ya confirmamos cobertura. Si me comparte sus datos, yo preparo la solicitud y le voy guiando paso por paso.”"
 :"Urgencia · Facilita el avance:\n“Ya confirmamos cobertura. Si me comparte sus datos, preparo la solicitud y avanzamos.”";
 const clo=data.tipo==="Nuevo"
 ?"Doble alternativa · Dale una decisión concreta:\n“¿Avanzamos con el paquete que revisamos o quiere que antes le muestre la siguiente velocidad?”"
 :"Conclusión · Lleva el acuerdo al siguiente paso:\n“Perfecto, entonces continuamos con sus datos para dejar preparada la solicitud.”";
 main.insertAdjacentHTML("beforeend",coach("FACTOR DE IMPULSO",imp,"impulse")+coach("TIPO DE CIERRE SUGERIDO",clo,"close"));
}
function documentos(){
 let extra=data.tipo==="Portabilidad"?`<div><b>✓</b> Número telefónico a portar</div><div><b>✓</b> NIP de portabilidad (051)</div>`:data.tipo==="Alta"?`<div><b>✓</b> Estado de cuenta de Megacable</div>`:"";
 draw("Captura","Pide todo en un solo mensaje","Evita pedir un dato, esperar y luego recordar otro.",`<div class=check><div><b>✓</b> INE por ambos lados</div><div><b>✓</b> Dirección completa + entre calles</div><div><b>✓</b> Número del titular</div><div><b>✓</b> Número de referencia/contacto</div><div><b>✓</b> Correo electrónico</div><div><b>✓</b> Foto de fachada (si el proceso la requiere)</div>${extra}</div>${opts([["Ya recibí los datos","Continuar a SMS de 4 dígitos.","nav(sms)","primary"]])}`,docMsg())}
function docMsg(){let x="Excelente 😁 Para generarle su solicitud necesito:\n\n📸 INE por ambos lados\n📌 Dirección completa y entre calles\n📞 Número del titular y uno de referencia\n📧 Correo electrónico";if(data.tipo==="Portabilidad")x+="\n☎️ Número a portar + NIP de portabilidad (marcando 051)";if(data.tipo==="Alta")x+="\n🧾 Estado de cuenta de Megacable";x+="\n🏠 Foto de fachada, si la tiene disponible\n\nMe lo puede compartir todo por aquí y comenzamos con su solicitud. ✅";return x}
function sms(){draw("Solicitud","Código SMS de 4 dígitos","El código es para finalizar la solicitud/generar folio. No lo confundas con la referencia de pago.",opts([["Código recibido","Generar / compartir folio y referencia.","nav(folio)","primary"],["No llega","Seguir procedimiento de reenvío / revisión.","nav(smsNo)"]]),"En unos minutos le llegará un mensaje SMS al teléfono del titular con un código de 4 números para finalizar la solicitud. Cuando le llegue, ¿me lo comparte por aquí por favor? ✅")}
function smsNo(){draw("SMS","No llega el código","Revisa datos y utiliza el procedimiento interno de reenvío.",opts([["Ya llegó","Continuar.","nav(folio)","primary"]]),"No se preocupe. Voy a revisar los datos y el envío. En cuanto se genere nuevamente le aviso para que me comparta los 4 dígitos.")}
function folio(){draw("Folio y pago","Comparte folio y referencia de pago","Continúa con el pago inicial de la solicitud.",opts([["Explicar dónde pagar","Abrir opciones de pago.","nav(pago)","primary"],["Coordinar validación","Explicar llamada breve.","nav(validacion)"]]),"Listo. Ya quedó su solicitud. En un momento le comparto su folio y el número de referencia asociado para realizar el pago inicial de $400.")}
function pago(){draw("Pago","Da instrucciones concretas","En los chats reales esta duda aparece mucho.",opts([["Pago realizado","Continuar a instalación / seguimiento.","nav(postPago)","primary"],["Quiere pagar después","Explicar vigencia según sistema.","nav(pagoDespues)"],["Pregunta por banca móvil","Responder.","nav(banca)"]]),"Puede realizar el pago con su número de referencia en los establecimientos autorizados o mediante el enlace de pago que reciba por SMS, cuando esté disponible. No se entrega dinero al técnico.")}
function banca(){draw("Pago por app","Referencia de pago","La app bancaria puede variar. La referencia está asociada al folio.",opts([["Entendido","Volver a pago.","nav(pago)","primary"]]),"En su banca móvil busque la opción de Pago de servicios y Telmex. Si le solicita referencia, utilice el número de referencia de su solicitud. Si su banco no permite procesarlo, puede usar el enlace recibido por SMS o un establecimiento autorizado.")}
function pagoDespues(){draw("Pago pendiente","No pierdas el seguimiento","Indica la vigencia real que muestre el sistema.",opts([["Volver a pago","Continuar.","nav(pago)","primary"]]),"Claro. Puede realizarlo dentro de la vigencia que aparece en su referencia. En cuanto se registre el pago, la orden puede continuar con el proceso de instalación.")}
function validacion(){draw("Validación","Prepara al cliente antes de la llamada","En los chats, avisar qué van a confirmar reduce fricción.",opts([["Validación lista","Seguir a pago/instalación.","nav(pago)","primary"]]),"Le va a entrar una llamada breve del departamento de validación. Es para corroborar el paquete solicitado y algunos datos de su solicitud. ¿La puede recibir ahora o prefiere que coordinemos otro horario?")}

function faq(){hist.push(current);current=faq;draw("Consulta","Dudas rápidas","Respuestas para no improvisar durante el chat.",`
<details><summary>¿Qué es domiciliar?</summary><p>Asignar una tarjeta para el cobro automático de los recibos. Para la promoción, el cliente elige HBO Max o Netflix por 6 meses.</p></details>
<details><summary>¿Los $400 se dan al técnico?</summary><p>No. Se pagan mediante la referencia asociada a la solicitud por los medios autorizados.</p></details>
<details><summary>¿Código SMS y referencia son lo mismo?</summary><p>No. El código SMS de 4 dígitos sirve para finalizar la solicitud; la referencia se utiliza para realizar el pago.</p></details>
<details><summary>¿Qué pide Alta Megacable?</summary><p>Además de los datos generales, <b>estado de cuenta de Megacable</b>.</p></details>
<details><summary>¿Qué pide Portabilidad?</summary><p>Datos generales + número telefónico a portar + NIP obtenido al 051.</p></details>

<details><summary>¿Qué son los factores de impulso?</summary><p><b>Pérdida:</b> destacar una condición real que puede terminar o no aplicar. <b>Urgencia:</b> hacer que el trámite se sienta sencillo y fácil de avanzar. <b>Codicia/beneficio:</b> resaltar lo que el cliente gana. <b>Exclusividad:</b> personalizar un beneficio real que sí le corresponda. No inventes promociones, folios limitados, fechas límite o beneficios que el sistema no confirme.</p></details>
<details><summary>¿Qué cierre conviene usar?</summary><p><b>Conclusión:</b> llevar naturalmente al siguiente paso. <b>Doble alternativa:</b> ofrecer dos opciones reales. <b>Amarre:</b> confirmar una ventaja con una pregunta breve. <b>Benjamín Franklin:</b> resumir costo vs. beneficio cuando hay indecisión. <b>Rebote:</b> convertir la objeción en una pregunta útil. El cierre debe ayudar a decidir, no inventar condiciones.</p></details>
<details><summary>Benjamín Franklin — cómo hacerlo bien</summary><p><b>No es solo enumerar beneficios.</b> La idea es poner las dos opciones en números y hacer visible el costo real.</p><div class=card><div class=row><span>1. Mensualidad actual</span><b>¿Cuánto paga?</b></div><div class=row><span>2. Velocidad</span><b>¿Cuántos megas?</b></div><div class=row><span>3. Promoción</span><b>¿Cuánto dura?</b></div><div class=row><span>4. Después</span><b>¿A cuánto sube?</b></div><div class=row><span>5. Instalación</span><b>¿Tiene costo?</b></div><div class=row><span>6. Total</span><b>Comparar 12 meses</b></div></div><p><b>Ejemplo de cierre:</b><br>“Mire, para compararlo de forma justa no nos quedemos solo con el precio promocional. Vamos a sacar cuánto pagaría el primer año completo y cuánto queda pagando después. Así usted decide con los costos reales enfrente.”</p><p><b>Ejemplo Telmex servicio nuevo $349:</b><br>$349 × 12 = $4,188 de servicio + $1,600 de instalación = <b>$5,788 el primer año</b>. Después de terminar la instalación, el servicio queda en <b>$349 al mes</b>, siempre que el precio del paquete no cambie.</p><p><b>Idea clave para capacitación:</b> si el competidor ofrece $350 “por promoción” pero después sube a $529, no compares $349 contra $350. Averigua cuántos meses dura el precio promocional y calcula el total anual. Ese es el verdadero Benjamín Franklin.</p></details>
<details><summary>Ejemplos útiles de cierre</summary><p><b>Doble alternativa:</b> “¿OXXO o pago desde casa?”, “¿Netflix o HBO Max?”, “¿paquete básico o más velocidad?”. Úsala cuando ambas opciones sean reales. Evita “¿hoy o mañana?” si la fecha depende del técnico.<br><br><b>Amarre:</b> úsalo sobre algo que el cliente ya confirmó: “Me comenta que Megacable ya le subió la tarifa, ¿verdad?” o “Me dice que Izzi le está fallando, ¿correcto?”.</p></details><details><summary>¿Cuándo debo dejar de explicar?</summary><p>Cuando ya hay cobertura, paquete aceptado y el cliente no tiene una objeción pendiente: <b>pide los datos y genera la solicitud.</b></p></details>`)}
